<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GODX2NYX // View Raw</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@700&display=swap');

  :root{
    --bg:#08090c;
    --panel:#0f1218;
    --line:#1d2330;
    --text:#d7dce3;
    --dim:#5b6472;
    --accent:#39ff9c;
    --accent-dim:#1c8a56;
    --warn:#ff5c5c;
    --mono:'JetBrains Mono', monospace;
    --disp:'Space Grotesk', sans-serif;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:
      radial-gradient(circle at 85% 0%, rgba(57,255,156,.05), transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:var(--mono);
    min-height:100vh;
    padding:40px 16px 60px;
  }

  .brand{
    max-width:820px; margin:0 auto 20px;
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
  }
  .brand-mark{ font-family:var(--disp); font-weight:700; font-size:18px; }
  .brand-mark span{ color:var(--accent); }
  .brand-tag{ font-size:11px; color:var(--dim); letter-spacing:.14em; text-transform:uppercase; }

  .container{
    max-width:820px; margin:0 auto;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
  }

  .meta-bar{
    padding:14px 20px;
    border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center;
    flex-wrap:wrap; gap:10px;
    font-size:11.5px; color:var(--dim);
  }
  .meta-bar b{ color:var(--text); }
  .id-tag{
    font-size:11px; color:var(--accent);
    background:rgba(57,255,156,.08);
    border:1px solid var(--accent-dim);
    padding:3px 8px; border-radius:4px;
  }

  .actions{ display:flex; gap:8px; }
  button{
    font-family:var(--mono); font-weight:700; font-size:11.5px;
    background:transparent; border:1px solid var(--line); color:var(--dim);
    padding:6px 12px; border-radius:6px; cursor:pointer; transition:.15s ease;
  }
  button:hover{ color:var(--text); border-color:var(--accent-dim); }

  pre{
    margin:0;
    padding:22px;
    overflow-x:auto;
    font-size:13.5px;
    line-height:1.6;
    white-space:pre-wrap;
    word-break:break-word;
    color:var(--text);
  }

  .state{
    padding:60px 20px;
    text-align:center;
    color:var(--dim);
    font-size:13px;
  }
  .state.error{ color:var(--warn); }

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px);
    background:#0f1218; border:1px solid var(--accent-dim); color:var(--text);
    padding:10px 18px; border-radius:6px; font-size:12.5px;
    opacity:0; pointer-events:none; transition:.2s ease;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

  <div class="brand">
    <div class="brand-mark">GODX2<span>NYX</span></div>
    <div class="brand-tag">Raw Viewer</div>
  </div>

  <div class="container">
    <div class="meta-bar" id="metaBar" style="display:none;">
      <span>ID: <span class="id-tag" id="rawId"></span></span>
      <span>สร้างเมื่อ: <b id="createdAt">-</b></span>
      <div class="actions">
        <button id="copyBtn">Copy content</button>
      </div>
    </div>

    <div id="content">
      <div class="state" id="loadingState">กำลังโหลด...</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  const toast = document.getElementById('toast');
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  }

  // ดึง id จาก path /r/:id
  const pathParts = window.location.pathname.split('/').filter(Boolean);
  const rawId = pathParts[pathParts.length - 1];

  let rawContent = '';

  async function loadRaw(){
    const contentBox = document.getElementById('content');

    if (!/^[A-Za-z0-9_-]{10,40}$/.test(rawId)) {
      contentBox.innerHTML = '<div class="state error">ลิงก์ไม่ถูกต้อง</div>';
      return;
    }

    try {
      const res = await fetch('/api/raw/' + encodeURIComponent(rawId));
      const data = await res.json();

      if (!data.success) {
        contentBox.innerHTML = '<div class="state error">ลิงก์นี้หมดอายุหรือไม่พบข้อมูล</div>';
        return;
      }

      rawContent = data.content;

      document.getElementById('rawId').textContent = rawId;
      document.getElementById('createdAt').textContent = new Date(data.created_at).toLocaleString('th-TH');
      document.getElementById('metaBar').style.display = 'flex';

      // ใช้ textContent เท่านั้น ห้าม innerHTML กับข้อมูลดิบจากผู้ใช้ เพื่อกัน XSS
      const pre = document.createElement('pre');
      pre.textContent = rawContent;
      contentBox.innerHTML = '';
      contentBox.appendChild(pre);

    } catch (err) {
      contentBox.innerHTML = '<div class="state error">เชื่อมต่อเซิร์ฟเวอร์ไม่ได้</div>';
    }
  }

  document.getElementById('copyBtn')?.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(rawContent);
      showToast('Copied content');
    } catch {
      showToast('Copy failed');
    }
  });

  loadRaw();
</script>
</body>
</html>
